<title>Redirigiendo… | +Sustentable</title>
<script>
  /*
   * La plataforma se trasladó a app.massustentable.cl.
   * Toda ruta que no exista en la landing (p. ej. /autodiagnostico/xyz/seccion/2 o
   * /reset-password?email=...) se reenvía a la app conservando ruta, parámetros y ancla.
   */
  (function () {
    var APP = "https://app.massustentable.cl";
    var destino = APP + window.location.pathname + window.location.search + window.location.hash;
    window.location.replace(destino);
  })();
</script>
